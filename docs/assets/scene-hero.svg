<svg xmlns="http://www.w3.org/2000/svg" width="600" height="456" viewBox="0 0 300 228" role="img" aria-label="Friends around a round table: Maya talking, Jun slumped away, Leo staring after reading, You watching"><defs><clipPath id="card"><rect width="300" height="228" rx="16"/></clipPath></defs><g clip-path="url(#card)">
      <rect width="300" height="228" fill="#fff7ee" />
      <rect y="150" width="300" height="78" fill="#f1dcc3" />
      <!-- speech bubble -->
      <g transform="translate(18 26)">
        <rect width="128" height="30" rx="15" fill="#fff" />
        <path d="M34 29 l8 9 l4 -9 z" fill="#fff" />
        <text x="64" y="20" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="800" fill="#1d1b26">friday. still on??</text>
      </g>
      <!-- caption chip -->
      <g transform="translate(176 22)">
        <rect width="100" height="22" rx="11" fill="#1d1b26" />
        <text x="50" y="15" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="800" fill="#fff">Read 9:41 PM</text>
      </g>
      <!-- chairs -->
      <g fill="#8c6ff0">
        <rect x="30" y="92" width="52" height="64" rx="18" />
        <rect x="92" y="80" width="52" height="64" rx="18" />
        <rect x="156" y="80" width="52" height="64" rx="18" />
        <rect x="218" y="92" width="52" height="64" rx="18" />
      </g>
      <!-- Maya: watching, talking -->
      <g transform="translate(56 100)">
        <rect x="-19" y="22" width="38" height="44" rx="16" fill="#ff8a65" />
        <circle r="23" fill="#f5cba7" />
        <path d="M-24 -4 a24 24 0 0 1 48 0 l0 -6 a24 22 0 0 0 -48 0 z" fill="#2b2118" />
        <path d="M-24 -2 C-24 -30 24 -30 24 -2 C14 -12 -14 -12 -24 -2z" fill="#2b2118" />
        <circle cx="-8" cy="3" r="2.6" fill="#2a2230" /><circle cx="8" cy="3" r="2.6" fill="#2a2230" />
        <ellipse cx="0" cy="13" rx="5" ry="4" fill="#7a2f3b" />
      </g>
      <!-- Jun: away (slumped) -->
      <g transform="translate(118 112)" opacity="0.62">
        <rect x="-19" y="12" width="38" height="44" rx="16" fill="#7c83fd" />
        <g transform="rotate(12)">
          <circle r="22" fill="#e0ac86" />
          <path d="M-22 -2 C-22 -28 22 -28 22 -2 C12 -10 -12 -10 -22 -2z" fill="#2b2118" />
          <rect x="-11" y="5" width="7" height="2" rx="1" fill="#2a2230" /><rect x="4" y="5" width="7" height="2" rx="1" fill="#2a2230" />
        </g>
        <text x="20" y="-18" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="900" fill="#8b7bd8">z</text>
        <text x="28" y="-28" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="900" fill="#8b7bd8">z</text>
      </g>
      <!-- Leo: read and ignore -->
      <g transform="translate(182 92)">
        <rect x="-19" y="22" width="38" height="44" rx="16" fill="#ffc93c" />
        <g transform="translate(-4 0) rotate(-8)">
          <circle r="22" fill="#c68863" />
          <path d="M-22 -2 C-22 -28 22 -28 22 -2 C12 -10 -12 -10 -22 -2z" fill="#6b4226" />
          <circle cx="-12" cy="3" r="2.4" fill="#2a2230" /><circle cx="2" cy="3" r="2.4" fill="#2a2230" />
          <rect x="-8" y="12" width="8" height="2" rx="1" fill="#7a2f3b" />
        </g>
        <text x="-14" y="-28" font-size="18">👀</text>
      </g>
      <!-- You: watching, mint ring -->
      <g transform="translate(244 104)">
        <rect x="-19" y="22" width="38" height="44" rx="16" fill="#3fd3a4" />
        <circle r="23" fill="#fce3d2" stroke="#3fd3a4" stroke-width="3" />
        <path d="M-23 -1 C-23 -30 23 -30 23 -1 C13 -11 -13 -11 -23 -1z" fill="#e46a4b" />
        <circle cx="-8" cy="4" r="2.6" fill="#2a2230" /><circle cx="8" cy="4" r="2.6" fill="#2a2230" />
        <rect x="-4" y="13" width="8" height="2.4" rx="1.2" fill="#7a2f3b" />
      </g>
      <!-- table -->
      <ellipse cx="150" cy="190" rx="142" ry="38" fill="#8f5b31" />
      <ellipse cx="150" cy="182" rx="142" ry="36" fill="#d79b6c" />
      <g font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="800" text-anchor="middle">
        <rect x="36" y="160" width="40" height="15" rx="7.5" fill="#fff" /><text x="56" y="171" fill="#5a4a3a">Maya</text>
        <rect x="100" y="156" width="36" height="15" rx="7.5" fill="#fff" opacity="0.7" /><text x="118" y="167" fill="#5a4a3a">Jun</text>
        <rect x="162" y="156" width="36" height="15" rx="7.5" fill="#fff" /><text x="180" y="167" fill="#5a4a3a">Leo</text>
        <rect x="226" y="160" width="36" height="15" rx="7.5" fill="#3fd3a4" /><text x="244" y="171" fill="#053b2c">You</text>
      </g>
    </g></svg>
